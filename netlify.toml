[build]
  command = "rm -rf .netlify/.next/cache .next/cache && npm run build && rm -rf .netlify/.next/cache .next/cache"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,.next/cache/**,**/.next/cache/**,**/*.sst"
  SECRETS_SCAN_OMIT_KEYS = "RESEND_API_KEY,GOOGLE_CLIENT_SECRET,CLOUDINARY_API_SECRET"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache static hashed assets for 1 year
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.(woff|woff2|ttf|otf|eot)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static images and icons
[[headers]]
  for = "/*.(svg|png|jpg|jpeg|webp|avif|ico)"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
